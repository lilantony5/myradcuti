<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyRadCuti HKL</title>
<meta name="description" content="Radiologist leave calendar – Jabatan Radiologi, Hospital Kuala Lumpur">

<!-- Home-screen icon + app behaviour (iPhone) -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyRadCuti">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Android / desktop -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#0b1f3a">
<!-- WhatsApp / link preview text -->
<meta property="og:title" content="MyRadCuti HKL">
<meta property="og:description" content="Apply and view radiologist leave – Jabatan Radiologi HKL">

<style>
  html,body{margin:0;height:100%;background:#0b1f3a;overflow:hidden}
  /* keep the dashboard below the iPhone notch / status bar when opened from the home screen */
  .wrap{position:fixed;inset:0;padding-top:env(safe-area-inset-top);background:#0b1f3a}
  iframe{border:0;width:100%;height:100%;display:block;background:#0b1f3a}
  .splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:linear-gradient(115deg,#0b1f3a 0%,#123a5f 55%,#0f766e 100%);color:#cbd5e1;font:500 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;transition:opacity .35s}
  .splash img{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .splash b{color:#fff;font-size:20px;letter-spacing:-.01em}
  .bar{width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#5eead4;border-radius:4px;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  .splash a{color:#5eead4;display:none}
  .gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="wrap"><iframe id="app" title="MyRadCuti HKL" allow="clipboard-read; clipboard-write; camera; fullscreen"></iframe></div>
<div class="splash" id="splash">
  <img src="icon-192.png" alt="">
  <b>MyRadCuti HKL</b>
  <div class="bar"><i></i></div>
  <a id="direct" target="_top">Taking long? Tap here to open directly</a>
</div>
<script>
  /* ====== THE ONLY LINE TO EDIT: paste your Apps Script Web app URL (ends in /exec) ====== */
  const APP_URL = 'https://script.google.com/a/macros/moh.gov.my/s/AKfycbze7rnknSDqlthKEipS5v-A_j4mJx7F6oP-FpumTy-w7rgPxi-At6mUTf1kdRIlsYlF/exec';
  /* ======================================================================================= */

  const frame = document.getElementById('app'), splash = document.getElementById('splash'), direct = document.getElementById('direct');
  direct.href = APP_URL;
  if (!/^https:\/\/script\.google\.com\//.test(APP_URL)) {
    splash.querySelector('b').textContent = 'Setup needed: add the web app URL in index.html';
    splash.querySelector('.bar').remove();
  } else {
    frame.src = APP_URL;
    frame.addEventListener('load', () => setTimeout(() => splash.classList.add('gone'), 250));
    setTimeout(() => { direct.style.display = 'block'; }, 12000);
  }

  /* ---- "📲 Add to Home Screen" button inside the app ----
     The app (inside the frame) says hello; we tell it whether it is already on the home screen and
     whether this phone can install with one tap (Android Chrome). On iPhone the app shows the Safari steps. */
  const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  let deferred = null, appWin = null, appOrigin = '*';
  const wantInstall = location.hash === '#install'; // came from the app's 📲 button → open the install help straight away
  if (wantInstall) try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  const tell = () => { if (appWin) try { appWin.postMessage({ myradcuti: 'shell', url: location.origin + location.pathname, standalone: standalone(), canInstall: !!deferred, install: wantInstall }, appOrigin); } catch (e) {} };
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; tell(); });
  window.addEventListener('appinstalled', () => { deferred = null; if (appWin) try { appWin.postMessage({ myradcuti: 'installed' }, appOrigin); } catch (e) {} });
  window.addEventListener('message', async e => {
    if (!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(e.origin)) return; // only the Apps Script app
    const m = e.data || {};
    if (m.myradcuti === 'hello') { appWin = e.source; appOrigin = e.origin; tell(); }
    if (m.myradcuti === 'install' && deferred) {
      deferred.prompt();
      try { await deferred.userChoice; } catch (err) {}
      deferred = null; tell();
    }
  });
</script>
</body>
</html>
